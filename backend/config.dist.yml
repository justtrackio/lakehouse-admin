app:
  env: dev
  name: lakehouse-admin

cloud:
  aws:
    defaults:
      endpoint: ""
      region: "eu-central-1"

httpserver:
  default:
    port: 8081
    mode: release
    timeout:
      read: 10m
      write: 10m

iceberg:
  catalog: lakehouse
  default_database: main
  databases:
    - main
  needs_optimize_delay: 96h # 4 days

kube:
  client_mode: "in-cluster"
  context: "your-kube-config-ctx-name"

log:
  level: info

refresh:
  enabled: false
  cron: "0 * * * *"

tasks:
  enabled: true
  worker_count: 1
  poll_interval: 1s
  schedule:
    enabled: false
    cron: "0 2 * * *"
    optimize:
      lookback_days: 30
      target_file_size_mb: 512
      chunk_by: daily
    expire_snapshots:
      retention_days: 7
    remove_orphan_files:
      retention_days: 7
  engines:
    expire_snapshots: spark
    remove_orphan_files: spark
    optimize: spark
  spark:
    driver_pod_spec:
      annotations: {}
      node_selector: {}
      tolerations: []
    executor_pod_spec:
      annotations: {}
      node_selector: {}
      tolerations: []
    optimize:
      partial_progress_enabled: false
      partial_progress_max_commits: 10
      max_concurrent_file_group_rewrites: 5
    callback:
      enabled: false
      backend_host: ""

sqlc:
  default:
    driver: mysql
    uri:
      host: localhost
      user: root
      password: justtrack
      database: lakehouse_admin
    migrations:
      enabled: true
      path: build/migrations
